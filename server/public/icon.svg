<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#d98c6e"/>
      <stop offset="0.55" stop-color="#9c8fe0"/>
      <stop offset="1" stop-color="#7580e6"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="c"><circle cx="256" cy="256" r="176"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#0a0a0c"/>
  <circle cx="256" cy="256" r="176" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect x="80" y="80" width="352" height="352" fill="#808080" filter="url(#grain)" opacity="0.35"/></g>
  <!-- the Pareto frontier: nobody on the line is beaten on both price and quality -->
  <path d="M84 410 H190 V334 H270 V252 H350 V172 H432" fill="none" stroke="#f4f4f5" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="190" cy="334" r="15" fill="#0a0a0c" stroke="#f4f4f5" stroke-width="10"/>
  <circle cx="270" cy="252" r="15" fill="#0a0a0c" stroke="#f4f4f5" stroke-width="10"/>
  <circle cx="350" cy="172" r="15" fill="#0a0a0c" stroke="#f4f4f5" stroke-width="10"/>
</svg>
